name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.9"

jobs:
  release-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate release tag version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' is not valid semver (expected vX.Y.Z or vX.Y.Z-prerelease)."
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.version);')"

          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Git tag version '$tag_version' does not match package.json version '$package_version'."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: OpenAPI drift check
        run: bun run openapi:check

      - name: Test
        run: bun test

      - name: Build release artifacts
        run: bun run release:build
        env:
          CHIMERA_BENCH_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/release/chimera-bench-*

  npm-publish:
    runs-on: ubuntu-latest
    needs: release-artifacts
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm token is configured
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::Missing NPM_TOKEN secret. Configure NPM_TOKEN to publish the chimera-bench npm package."
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync npm package version
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          npm version "$release_version" --no-git-tag-version --allow-same-version
        working-directory: npm/chimera-bench

      - name: Pack npm package
        run: npm pack --dry-run
        working-directory: npm/chimera-bench

      - name: Publish npm package
        run: npm publish --access public
        working-directory: npm/chimera-bench
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
