name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.9"

jobs:
  release-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate release tag version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' is not valid semver (expected vX.Y.Z or vX.Y.Z-prerelease)."
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.version);')"

          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Git tag version '$tag_version' does not match package.json version '$package_version'."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: OpenAPI drift check
        run: bun run openapi:check

      - name: Test
        run: bun test

      - name: Build release artifacts
        run: bun run release:build
        env:
          CHIMERA_BENCH_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Upload release artifacts for npm publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chimera-bench-release-artifacts
          if-no-files-found: error
          path: |
            dist/release/chimera-bench-darwin-arm64
            dist/release/chimera-bench-darwin-x64
            dist/release/chimera-bench-linux-arm64
            dist/release/chimera-bench-linux-x64-baseline
            dist/release/chimera-bench-sha256sums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/release/chimera-bench-*

  npm-publish:
    runs-on: ubuntu-latest
    needs: release-artifacts
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing OIDC auth
    env:
      CHIMERA_BENCH_REPOSITORY_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chimera-bench-release-artifacts
          path: dist/release

      - name: Ensure npm supports trusted publishing
        run: |
          # npm trusted publishing requires npm >= 11.5.1 and Node >= 22.14.
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - name: Prepare npm packages
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          node ./npm/chimera-bench/scripts/prepare-platform-packages.js "$release_version"

      - name: Pack npm package (darwin-arm64)
        run: npm pack --dry-run
        working-directory: dist/npm-staging/chimera-bench-darwin-arm64

      - name: Pack npm package (darwin-x64)
        run: npm pack --dry-run
        working-directory: dist/npm-staging/chimera-bench-darwin-x64

      - name: Pack npm package (linux-arm64)
        run: npm pack --dry-run
        working-directory: dist/npm-staging/chimera-bench-linux-arm64

      - name: Pack npm package (linux-x64-baseline)
        run: npm pack --dry-run
        working-directory: dist/npm-staging/chimera-bench-linux-x64-baseline

      - name: Pack npm package (shim)
        run: npm pack --dry-run
        working-directory: dist/npm-staging/chimera-bench

      - name: Publish npm package (darwin-arm64)
        # Trusted publishing uses OIDC from id-token permission; no npm token secret.
        run: npm publish --access public
        working-directory: dist/npm-staging/chimera-bench-darwin-arm64
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Publish npm package (darwin-x64)
        run: npm publish --access public
        working-directory: dist/npm-staging/chimera-bench-darwin-x64
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Publish npm package (linux-arm64)
        run: npm publish --access public
        working-directory: dist/npm-staging/chimera-bench-linux-arm64
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Publish npm package (linux-x64-baseline)
        run: npm publish --access public
        working-directory: dist/npm-staging/chimera-bench-linux-x64-baseline
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Publish npm package (shim)
        run: npm publish --access public
        working-directory: dist/npm-staging/chimera-bench
        env:
          NPM_CONFIG_PROVENANCE: "true"
